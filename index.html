<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>班组产值与工时采访系统</title>
<!-- 钉钉 JSAPI SDK -->
<script src="https://g.alicdn.com/dingding/dingtalk-jsapi/3.0.25/dingtalk.open.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f5f5f5; }
.hidden { display: none !important; }

/* Welcome Page */
#welcome { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #EEF2FF 0%, #F9FAFB 50%, #ECFDF5 100%); padding: 24px; }
.welcome-card { background: #fff; border-radius: 24px; padding: 56px 48px; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.08); text-align: center; }
.welcome-icon { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #4F46E5, #7C3AED); display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; }
.welcome-icon svg { width: 40px; height: 40px; }
.welcome-card h1 { font-size: 28px; font-weight: 700; color: #111827; margin-bottom: 12px; }
.welcome-card p { font-size: 16px; color: #6B7280; line-height: 1.7; margin-bottom: 36px; }
.feature-tags { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 36px; }
.feature-tag { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 12px; background: #F9FAFB; border: 1px solid #E5E7EB; font-size: 14px; color: #374151; font-weight: 500; }
.feature-tag svg { width: 18px; height: 18px; }
.btn-primary { background: linear-gradient(135deg, #4F46E5, #7C3AED); color: #fff; border: none; border-radius: 14px; padding: 14px 40px; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 14px rgba(79,70,229,0.35); transition: transform 0.15s, box-shadow 0.15s; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,0.45); }
.btn-primary svg { width: 18px; height: 18px; }
.btn-link { background: none; border: none; color: #4F46E5; font-size: 14px; cursor: pointer; font-weight: 500; margin-top: 20px; }

/* Interview Page */
#interview { min-height: 100vh; background: #F3F4F6; display: flex; justify-content: center; padding: 32px 16px; }
.interview-container { max-width: 640px; width: 100%; }
.interview-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.interview-header-left { display: flex; align-items: center; gap: 12px; }
.interview-header-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #4F46E5, #7C3AED); display: flex; align-items: center; justify-content: center; }
.interview-header-icon svg { width: 20px; height: 20px; }
.interview-header-title { font-weight: 700; font-size: 18px; color: #111827; }
.interview-header-sub { font-size: 13px; color: #9CA3AF; }
.btn-exit { background: none; border: 1px solid #D1D5DB; border-radius: 8px; padding: 6px 14px; font-size: 13px; color: #6B7280; cursor: pointer; }
.progress-bar { height: 4px; background: #E5E7EB; border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #4F46E5, #7C3AED); border-radius: 2px; transition: width 0.4s ease; }

/* Chat Messages */
.chat-history { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
.chat-msg { display: flex; }
.chat-msg.question { justify-content: flex-end; }
.chat-msg.answer { justify-content: flex-start; }
.chat-bubble { padding: 10px 16px; border-radius: 16px; max-width: 80%; font-size: 14px; }
.chat-msg.question .chat-bubble { background: #4F46E5; color: #fff; border-radius: 16px 16px 4px 16px; font-weight: 500; box-shadow: 0 1px 3px rgba(79,70,229,0.2); }
.chat-msg.answer .chat-bubble { background: #fff; color: #374151; border-radius: 16px 16px 16px 4px; border: 1px solid #E5E7EB; }

/* Question Card */
.question-card { background: #fff; border-radius: 20px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #E5E7EB; }
.question-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.question-icon { width: 36px; height: 36px; border-radius: 10px; background: #EEF2FF; display: flex; align-items: center; justify-content: center; }
.question-icon svg { width: 18px; height: 18px; }
.question-icon.warning { background: #FEF3C7; }
.question-icon.warning svg { color: #D97706; }
.question-icon.danger { background: #FEE2E2; }
.question-icon.danger svg { color: #DC2626; }
.question-label { font-size: 16px; font-weight: 600; color: #111827; }
.question-input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid #E5E7EB; font-size: 15px; outline: none; box-sizing: border-box; background: #FAFAFA; transition: border-color 0.2s, background 0.2s; }
.question-input:focus { border-color: #4F46E5; background: #fff; }

/* Reason Selection */
.reason-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.reason-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid #E5E7EB; background: #fff; cursor: pointer; font-size: 14px; color: #6B7280; transition: all 0.15s; }
.reason-btn.selected { border-color: var(--reason-color); background: var(--reason-bg); color: var(--reason-color); font-weight: 600; }
.reason-btn svg { width: 15px; height: 15px; }
.reason-hint { font-size: 13px; color: #9CA3AF; margin-top: 14px; }

/* Reason Detail */
.reason-detail-list { display: flex; flex-direction: column; gap: 14px; }
.reason-detail-item { display: flex; align-items: center; gap: 12px; }
.reason-detail-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.reason-detail-icon svg { width: 16px; height: 16px; }
.reason-detail-label { font-size: 14px; font-weight: 500; color: #374151; min-width: 80px; }
.reason-detail-input-wrap { flex: 1; position: relative; }
.reason-detail-input { width: 100%; padding: 10px 40px 10px 14px; border-radius: 10px; border: 1.5px solid #E5E7EB; font-size: 14px; outline: none; box-sizing: border-box; background: #FAFAFA; }
.reason-detail-input:focus { border-color: var(--reason-color); background: #fff; }
.reason-detail-unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #9CA3AF; }
.reason-detail-note { width: 100%; margin-top: 6px; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #E5E7EB; font-size: 13px; outline: none; box-sizing: border-box; background: #FAFAFA; resize: vertical; min-height: 36px; font-family: inherit; }
.reason-detail-note:focus { border-color: var(--reason-color); background: #fff; }
.reason-detail-note::placeholder { color: #C0C4CC; }
.reason-field-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1.5px solid #E5E7EB; font-size: 14px; outline: none; box-sizing: border-box; background: #FAFAFA; transition: border-color 0.2s, background 0.2s; }
.reason-field-input:focus { border-color: var(--reason-color); background: #fff; }
.loss-total { margin-top: 16px; padding: 10px 14px; background: #FEF2F2; border-radius: 10px; font-size: 13px; color: #991B1B; }
.loss-total strong { font-weight: 700; }

/* Completion */
.completion { text-align: center; padding: 12px 0; }
.completion-icon { width: 56px; height: 56px; border-radius: 50%; background: #ECFDF5; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.completion-icon svg { width: 28px; height: 28px; color: #10B981; }
.completion h3 { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 8px; }
.completion p { font-size: 14px; color: #6B7280; margin-bottom: 4px; }
.completion .rate { font-size: 14px; color: #6B7280; margin-bottom: 16px; }
.completion .rate strong { font-weight: 700; }
.btn-submit { background: linear-gradient(135deg, #10B981, #059669); color: #fff; border: none; border-radius: 12px; padding: 12px 32px; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(16,185,129,0.3); }
.btn-submit svg { width: 18px; height: 18px; }

/* Navigation */
.nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; }
.btn-nav { display: flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: all 0.15s; }
.btn-nav:disabled { cursor: not-allowed; }
.btn-prev { border: 1px solid #D1D5DB; background: #fff; color: #374151; }
.btn-prev:disabled { color: #D1D5DB; }
.btn-next { border: none; background: #4F46E5; color: #fff; font-weight: 500; }
.btn-next:disabled { background: #E5E7EB; color: #9CA3AF; }
.btn-next.primary { background: linear-gradient(135deg, #4F46E5, #7C3AED); font-weight: 600; box-shadow: 0 2px 8px rgba(79,70,229,0.3); }
.btn-next.primary:disabled { background: #E5E7EB; color: #9CA3AF; box-shadow: none; }
.btn-nav svg { width: 16px; height: 16px; }

/* Dashboard */
#dashboard { min-height: 100vh; background: #F3F4F6; }
.dashboard-header { background: #fff; border-bottom: 1px solid #E5E7EB; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.dashboard-header-left { display: flex; align-items: center; gap: 12px; }
.dashboard-header-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #4F46E5, #7C3AED); display: flex; align-items: center; justify-content: center; }
.dashboard-header-icon svg { width: 18px; height: 18px; }
.dashboard-header-title { font-weight: 700; font-size: 17px; color: #111827; }
.dashboard-header-sub { font-size: 13px; color: #6B7280; margin-top: 2px; }
.dashboard-header-actions { display: flex; gap: 10px; align-items: center; }
.time-filter-toggle { display: flex; border-radius: 14px; background: #F3F4F6; gap: 6px; padding: 5px; border: none; }
.time-filter-btn { padding: 8px 18px; border: 2px solid transparent; border-radius: 10px; background: transparent; font-size: 14px; color: #6B7280; cursor: pointer; transition: all 0.2s; font-weight: 600; position: relative; }
.time-filter-btn:hover { transform: translateY(-1px); }
.time-filter-btn[data-param="day"] { color: #2563EB; }
.time-filter-btn[data-param="day"]:hover { background: rgba(37,99,235,0.08); }
.time-filter-btn[data-param="day"].active { background: #2563EB; color: #fff; border-color: #1D4ED8; box-shadow: 0 3px 10px rgba(37,99,235,0.4); }
.time-filter-btn[data-param="week"] { color: #7C3AED; }
.time-filter-btn[data-param="week"]:hover { background: rgba(124,58,237,0.08); }
.time-filter-btn[data-param="week"].active { background: #7C3AED; color: #fff; border-color: #6D28D9; box-shadow: 0 3px 10px rgba(124,58,237,0.4); }
.time-filter-btn[data-param="month"] { color: #059669; }
.time-filter-btn[data-param="month"]:hover { background: rgba(5,150,105,0.08); }
.time-filter-btn[data-param="month"].active { background: #059669; color: #fff; border-color: #047857; box-shadow: 0 3px 10px rgba(5,150,105,0.4); }
.date-picker-wrap { display: flex; align-items: center; gap: 8px; margin-left: 8px; }
.date-picker-wrap label { font-size: 13px; color: #6B7280; font-weight: 500; white-space: nowrap; }
.date-picker-input { padding: 8px 12px; border: 1.5px solid #D1D5DB; border-radius: 8px; font-size: 14px; color: #374151; background: #fff; outline: none; transition: border-color 0.2s; }
.date-picker-input:focus { border-color: #4F46E5; }
.btn-add { display: flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 10px; border: none; background: linear-gradient(135deg, #4F46E5, #7C3AED); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(79,70,229,0.25); }
.btn-add svg { width: 15px; height: 15px; }
.btn-home { padding: 8px 14px; border-radius: 10px; border: 1px solid #D1D5DB; background: #fff; font-size: 13px; color: #6B7280; cursor: pointer; }
.btn-export { display: flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 10px; border: none; background: linear-gradient(135deg, #059669, #10B981); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(5,150,105,0.25); }
.btn-export svg { width: 15px; height: 15px; }
.dashboard-content { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }

/* KPI Cards */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: #fff; border-radius: 16px; padding: 20px 22px; border: 1px solid #E5E7EB; }
.kpi-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.kpi-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.kpi-icon svg { width: 18px; height: 18px; }
.kpi-label { font-size: 13px; color: #6B7280; }
.kpi-value { font-size: 28px; font-weight: 700; color: #111827; }
.kpi-sub { font-size: 12px; color: #9CA3AF; margin-top: 4px; }

/* Chart Cards */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin-bottom: 16px; }
.chart-card { background: #fff; border-radius: 16px; padding: 20px 22px; border: 1px solid #E5E7EB; }
.chart-card h3 { font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 16px; margin-top: 0; }
.chart-container { width: 100%; height: 260px; }
.chart-container canvas { width: 100% !important; height: 100% !important; }

/* Data Table */
.table-card { background: #fff; border-radius: 16px; border: 1px solid #E5E7EB; overflow: hidden; }
.table-header { padding: 16px 22px; border-bottom: 1px solid #E5E7EB; display: flex; align-items: center; justify-content: space-between; }
.table-header h3 { font-size: 15px; font-weight: 600; color: #111827; margin: 0; }
.table-header span { font-size: 12px; color: #9CA3AF; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 10px 14px; text-align: left; font-weight: 600; color: #6B7280; border-bottom: 1px solid #E5E7EB; white-space: nowrap; background: #F9FAFB; }
td { padding: 12px 14px; border-bottom: 1px solid #F3F4F6; }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.btn-detail { background: none; border: 1px solid #E5E7EB; border-radius: 6px; padding: 3px 8px; font-size: 12px; color: #6B7280; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.btn-detail svg { width: 12px; height: 12px; }
.detail-row td { padding: 0 14px 14px; background: #FAFAFA; }
.detail-content { padding: 12px 16px; background: #fff; border-radius: 10px; border: 1px solid #E5E7EB; margin-top: 4px; }
.detail-content-title { font-size: 12px; font-weight: 600; color: #6B7280; margin-bottom: 10px; }
.detail-reasons { display: flex; flex-wrap: wrap; gap: 8px; }
.detail-reason-tag { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid; }
.detail-reason-tag svg { width: 14px; height: 14px; }
.detail-reason-name { font-size: 13px; color: #374151; font-weight: 500; }
.detail-reason-hours { font-size: 12px; font-weight: 700; }

/* Analysis Display */
.analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.analysis-item { padding: 12px 14px; background: #F9FAFB; border-radius: 10px; border: 1px solid #E5E7EB; }
.analysis-item.warn { background: #FEF2F2; border-color: #FECACA; }
.analysis-item.ok { background: #ECFDF5; border-color: #A7F3D0; }
.analysis-item-label { font-size: 12px; color: #6B7280; margin-bottom: 4px; }
.analysis-item-value { font-size: 18px; font-weight: 700; }
.analysis-item-sub { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
.coverage-bar-wrap { margin-bottom: 16px; }
.coverage-bar { height: 8px; background: #E5E7EB; border-radius: 4px; overflow: hidden; }
.coverage-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.coverage-text { font-size: 13px; margin-top: 6px; }
.btn-add-reasons { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; border-radius: 10px; border: 1.5px dashed #D1D5DB; background: #fff; cursor: pointer; font-size: 14px; color: #6B7280; margin-top: 12px; transition: all 0.15s; }
.btn-add-reasons:hover { border-color: #4F46E5; color: #4F46E5; }

/* ==================== DingTalk H5 Mobile Adaptation ==================== */
/* Safe area padding for iPhone notch */
@supports (padding-top: env(safe-area-inset-top)) {
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .dashboard-header { padding-top: calc(16px + env(safe-area-inset-top)); }
}

/* Mobile responsive (< 768px) */
@media screen and (max-width: 768px) {
  .welcome-card { padding: 36px 24px; border-radius: 20px; }
  .welcome-card h1 { font-size: 22px; }
  .welcome-card p { font-size: 14px; }
  .btn-primary { padding: 12px 28px; font-size: 15px; width: 100%; justify-content: center; }

  .interview-container { max-width: 100%; padding: 0 4px; }
  .question-card { padding: 20px 16px; border-radius: 16px; }
  .question-label { font-size: 15px; }
  .question-input { font-size: 16px; padding: 14px 16px; }
  .chat-bubble { max-width: 90%; font-size: 14px; }
  .nav-buttons { gap: 10px; }
  .btn-nav { padding: 12px 16px; font-size: 14px; flex: 1; justify-content: center; }

  .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
  .dashboard-header-title { font-size: 15px; }
  .dashboard-header-actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
  .dashboard-content { padding: 16px; }

  .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi-card { padding: 14px 12px; }
  .kpi-value { font-size: 20px; }
  .kpi-label { font-size: 12px; }

  .chart-grid { grid-template-columns: 1fr; gap: 12px; }
  .chart-card { padding: 16px; }
  .chart-container { height: 220px; }

  .table-card { border-radius: 12px; }
  .table-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
  table { font-size: 12px; }
  th, td { padding: 8px 10px; }

  .analysis-grid { grid-template-columns: 1fr; }
  .reason-grid { gap: 8px; }
  .reason-btn { padding: 10px 14px; font-size: 13px; }
  .reason-field-input { padding: 12px 14px; font-size: 16px; }
  .reason-detail-note { padding: 10px 12px; font-size: 15px; }

  .time-filter-toggle { width: 100%; justify-content: center; }
  .time-filter-btn { flex: 1; text-align: center; padding: 10px 12px; }
  .date-picker-wrap { width: 100%; margin-left: 0; margin-top: 8px; }
  .date-picker-input { flex: 1; }

  .btn-submit { width: 100%; justify-content: center; padding: 14px 24px; }
  .btn-add { width: 100%; justify-content: center; }
}

/* Settings Modal */
.settings-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px; }
.settings-modal { background: #fff; border-radius: 20px; padding: 28px; max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.settings-modal h3 { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.settings-section { margin-bottom: 20px; }
.settings-section-title { font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.settings-section-desc { font-size: 12px; color: #9CA3AF; margin-bottom: 10px; line-height: 1.6; }
.settings-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #E5E7EB; font-size: 14px; outline: none; background: #FAFAFA; transition: border-color 0.2s; box-sizing: border-box; }
.settings-input:focus { border-color: #4F46E5; background: #fff; }
.settings-btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
.settings-btn { padding: 10px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
.settings-btn-cancel { background: #F3F4F6; color: #6B7280; }
.settings-btn-save { background: linear-gradient(135deg, #4F46E5, #7C3AED); color: #fff; box-shadow: 0 2px 8px rgba(79,70,229,0.3); }
.settings-btn-test { background: linear-gradient(135deg, #059669, #10B981); color: #fff; box-shadow: 0 2px 8px rgba(5,150,105,0.3); }
.settings-status { font-size: 12px; margin-top: 8px; padding: 8px 12px; border-radius: 8px; display: none; }
.settings-status.success { display: block; background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
.settings-status.error { display: block; background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
.settings-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.settings-badge.on { background: #ECFDF5; color: #059669; }

var JSONBIN_API_KEY = "$2a$10$kGOwsMptKbVPCmtGDvNK8OEzXj.SmYHX.HPy5hLdpIN8yYjKRpYmS";
var JSONBIN_BIN_ID = "6a631bd7f5f4af5e29ba44f4";
var JSONBIN_BASE_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

function uploadRecordToCloud(record) {
  if (!JSONBIN_API_KEY || !JSONBIN_BIN_ID) return;
  // Read existing records, append new one, write back
  var xhr = new XMLHttpRequest();
  xhr.open('GET', JSONBIN_BASE_URL + '/latest', true);
  xhr.setRequestHeader('X-Master-Key', JSONBIN_API_KEY);
  xhr.timeout = 8000;
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        var resp = JSON.parse(xhr.responseText);
        var data = resp.record || {};
        var records = data.records || [];
        records.push(record);
        // Write back
        var xhr2 = new XMLHttpRequest();
        xhr2.open('PUT', JSONBIN_BASE_URL, true);
        xhr2.setRequestHeader('Content-Type', 'application/json');
        xhr2.setRequestHeader('X-Master-Key', JSONBIN_API_KEY);
        xhr2.timeout = 8000;
        xhr2.onload = function() {
          // Upload complete (success or fail, silently handled)
        };
        xhr2.onerror = function() {};
        xhr2.ontimeout = function() {};
        xhr2.send(JSON.stringify({ records: records }));
      } catch(e) {}
    }
  };
  xhr.onerror = function() {};
  xhr.ontimeout = function() {};
  xhr.send();
}

// ==================== DINGTALK WEBHOOK NOTIFICATION ====================
function sendWebhookRequest(url, secret, payload, callback) {
  // If secret is provided, compute HMAC-SHA256 signature
  var finalUrl = url;
  if (secret && secret.indexOf('SEC') === 0) {
    var timestamp = Date.now();
    var stringToSign = timestamp + '\n' + secret;
    // Use SubtleCrypto for HMAC-SHA256 (async)
    computeHmacSha256(stringToSign, secret).then(function(sign) {
      var signEnc = encodeURIComponent(sign);
      finalUrl = url + '&timestamp=' + timestamp + '&sign=' + signEnc;
      doWebhookPost(finalUrl, payload, callback);
    }).catch(function(e) {
      // Fallback: try without signature
      doWebhookPost(url, payload, callback);
    });
  } else {
    doWebhookPost(finalUrl, payload, callback);
  }
}

function computeHmacSha256(message, secret) {
  // Use Web Crypto API (available in modern browsers)
  var enc = new TextEncoder();
  return crypto.subtle.importKey(
    'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  ).then(function(key) {
    return crypto.subtle.sign('HMAC', key, enc.encode(message));
  }).then(function(sig) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(sig)));
  });
}

function doWebhookPost(url, payload, callback) {
  var body = JSON.stringify(payload);
  // In DingTalk environment, use JSAPI to bypass CORS
  if (isDingTalkEnv && typeof dd !== 'undefined' && dd.httpRequest) {
    dd.httpRequest({
      url: url,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      data: body,
      contentType: 'application/json',
      dataType: 'json',
      success: function(res) {
        if (res && res.data) {
          var resp = typeof res.data === 'string' ? JSON.parse(res.data) : res.data;
          if (resp.errcode === 0) {
            callback(true, resp);
          } else {
            callback(false, resp.errmsg || 'errcode: ' + resp.errcode);
          }
        } else {
          callback(true, null);
        }
      },
      fail: function(err) {
        callback(false, err && err.errorMessage ? err.errorMessage : 'JSAPI请求失败');
      }
    });
  } else {
    // Fallback: XHR (only works from same-origin server or with CORS proxy)
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 10000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var resp = JSON.parse(xhr.responseText);
          if (resp.errcode === 0) {
            callback(true, resp);
          } else {
            callback(false, resp.errmsg || 'errcode: ' + resp.errcode);
          }
        } catch(e) {
          callback(true, null);
        }
      } else {
        callback(false, 'HTTP ' + xhr.status);
      }
    };
    xhr.onerror = function() { callback(false, '网络错误（非钉钉环境无法跨域，请部署为钉钉H5微应用）'); };
    xhr.ontimeout = function() { callback(false, '请求超时'); };
    xhr.send(body);
  }
}

function sendDingTalkNotification(record) {
  var config = getWebhookConfig();
  if (!config.enabled || !config.url) return;

  var compRate = pctNum(record.actualValue, record.targetValue);
  var statusText = getCompletionLabel(compRate);
  var statusEmoji = compRate >= 100 ? '&#x2705;' : compRate >= 90 ? '&#x1F7E1;' : '&#x274C;';

  // Build markdown message
  var text = '### ' + statusEmoji + ' ' + record.teamName + ' 产值日报\n\n';
  text += '**日期：** ' + record.date + '\n\n';
  text += '| 指标 | 数值 |\n|:---|:---|\n';
  text += '| 目标产值 | ' + fmtW(record.targetValue) + ' |\n';
  text += '| 实际产值 | ' + fmtW(record.actualValue) + ' |\n';
  text += '| 达成率 | **' + compRate.toFixed(1) + '%** |\n';
  text += '| 计划工时 | ' + record.standardHours + 'h |\n';
  text += '| 实际工时 | ' + record.actualHours + 'h |\n';

  if (record.plannedPH != null) {
    text += '| 计划人时产值 | ' + fmtPH(record.plannedPH) + ' 元/h |\n';
    text += '| 实际人时产值 | ' + fmtPH(record.actualPH) + ' 元/h |\n';
  }

  text += '\n**状态：** ' + statusText + '\n';

  // Add abnormal reasons if any
  if (record.abnormalReasons && record.abnormalReasons.length > 0) {
    var totalLoss = record.abnormalReasons.reduce(function(s, a) { return s + a.hours; }, 0);
    text += '\n**异常原因（合计 ' + totalLoss.toFixed(1) + 'h）：**\n\n';
    record.abnormalReasons.forEach(function(a) {
      text += '- **' + a.reason + '** ' + a.hours.toFixed(1) + 'h';
      if (a.note) text += '：' + a.note;
      text += '\n';
    });
    if (record.coverage != null) {
      text += '\n差距覆盖率：' + record.coverage.toFixed(0) + '%';
    }
  } else {
    text += '\n无异常，生产正常。';
  }

  var payload = {
    msgtype: "markdown",
    markdown: {
      title: record.teamName + ' 产值日报 ' + compRate.toFixed(1) + '%',
      text: text
    }
  };

  // Send asynchronously - don't block UI
  sendWebhookRequest(config.url, config.secret, payload, function(ok, resp) {
    if (ok) {
      console.log('[DingTalk] 通知发送成功');
    } else {
      console.warn('[DingTalk] 通知发送失败:', resp);
    }
  });
}

function exportCloudCSV() {
  if (cloudRecordsCache.length === 0) { alert('暂无数据可导出'); return; }
  var headers = ['日期','提交时间','班组','分析模式','目标产值','实际产值','达成率/DLE(%)','计划工时/有效工时','实际工时(h)','人时产值','损失工时','产值状态','效率状态','异常原因'];
  var rows = cloudRecordsCache.map(function(r) {
    var lossHours = (r.abnormalReasons || []).reduce(function(s, a) { return s + (a.hours || 0); }, 0);
    var reasons = (r.abnormalReasons || []).map(function(a) { return a.reason + '(' + (a.hours||0).toFixed(1) + 'h)' + (a.note ? ':' + a.note : ''); }).join('；');

    if (r.isDLE) {
      var dle = r.dle || 0;
      var dlePct = (dle * 100).toFixed(1);
      var eh = r.effectiveHours || 0;
      var ah = r.actualHours || 0;
      var dleThr = (r.teamName === "二部二课") ? 0.80 : 0.75;
      var effStatus = dle < dleThr ? 'DLE需分析' : 'DLE正常';
      return [r.date||'', r.submitTime||'', r.teamName||'', 'DLE分析', '', '', dlePct, eh, ah, '', lossHours.toFixed(1), '—', effStatus, reasons].join(',');
    } else {
      var compRate = r.targetValue > 0 ? (r.actualValue / r.targetValue * 100).toFixed(1) : '0.0';
      var isLowTarget = (r.targetValue || 0) < 1;
      var outputStatus = isLowTarget ? '—' : (r.actualValue >= r.targetValue ? '达标' : '未达标');
      var plannedPH = r.standardHours > 0 ? r.targetValue * 10000 / r.standardHours : 0;
      var actualPH = r.actualHours > 0 ? r.actualValue * 10000 / r.actualHours : 0;
      var hourDev = r.actualHours - r.standardHours;
      var efficiencyStatus = isLowTarget ? (hourDev > 0 ? '需分析' : hourDev === 0 ? '工时持平' : '正常') : (actualPH >= plannedPH ? '达标' : '未达标');
      return [r.date||'', r.submitTime||'', r.teamName||'', '人时产值分析', r.targetValue||0, r.actualValue||0, compRate, r.standardHours||0, r.actualHours||0, r.actualPH||'', lossHours.toFixed(1), outputStatus, efficiencyStatus, reasons].join(',');
    }
  });
  var csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '云端数据_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getISOWeek(dateStr) {
  var d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  var week1 = new Date(d.getFullYear(), 0, 4);
  return d.getFullYear() + "-W" + (1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7));
}
function getMonthKey(dateStr) {
  var d = new Date(dateStr);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function getWeekLabel(weekKey) {
  // weekKey = "2026-W30" -> "7月20日-7月26日"
  return getWeekDateRange(weekKey);
}
function getMonthLabel(monthKey) {
  // monthKey = "2026-07" -> "2026年7月"
  var parts = monthKey.split("-");
  return parts[0] + "年" + parseInt(parts[1]) + "月";
}
function getWeekDateRange(weekKey) {
  // weekKey = "2026-W30" -> "7月6日-7月12日"
  var parts = weekKey.split("-W");
  var year = parseInt(parts[0]);
  var week = parseInt(parts[1]);
  // Find Jan 4 of the year (always in ISO week 1)
  var jan4 = new Date(year, 0, 4);
  // Monday of week 1
  var monWeek1 = new Date(jan4);
  monWeek1.setDate(jan4.getDate() - (jan4.getDay() + 6) % 7);
  // Monday of target week
  var monday = new Date(monWeek1);
  monday.setDate(monWeek1.getDate() + (week - 1) * 7);
  // Sunday of target week
  var sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return (monday.getMonth()+1) + "月" + monday.getDate() + "日-" + (sunday.getMonth()+1) + "月" + sunday.getDate() + "日";
}
function formatDateShort(dateStr) {
  var d = new Date(dateStr);
  return (d.getMonth()+1) + "月" + d.getDate() + "日";
}

// Aggregate records by time dimension
function aggregateRecords(records, dimension) {
  // Apply date filter if set
  var filtered = records;
  if (dashboardDateFilter) {
    filtered = records.filter(function(r) {
      if (dimension === "day") return r.date === dashboardDateFilter;
      if (dimension === "week") return getISOWeek(r.date) === dashboardDateFilter;
      return getMonthKey(r.date) === dashboardDateFilter;
    });
  }
  if (dimension === "day") return filtered; // no aggregation for daily view

  var groups = {};
  var groupOrder = [];
  filtered.forEach(function(r) {
    var timeKey;
    if (dimension === "week") {
      timeKey = getISOWeek(r.date);
    } else {
      timeKey = getMonthKey(r.date);
    }
    // Group by team + time period so each team's weekly/monthly data is shown separately
    var key = (r.teamName || "未知班组") + "|" + timeKey;
    if (!groups[key]) {
      var timeLabel = dimension === "week" ? getWeekLabel(timeKey) : getMonthLabel(timeKey);
      groups[key] = {
        key: key,
        label: r.teamName || "未知班组",
        teamName: r.teamName || "未知班组",
        leader: r.leader || "",
        date: timeKey,
        targetValue: 0,
        actualValue: 0,
        standardHours: 0,
        actualHours: 0,
        effectiveHours: 0,
        abnormalReasons: [],
        plannedPH: 0,
        actualPH: 0,
        hoursGap: 0,
        lossGap: 0,
        totalLossAnalyzed: 0,
        coverage: 0,
        isDLE: r.isDLE || false,
        _count: 0,
        _reasonMap: {}
      };
      groupOrder.push(key);
    }
    var g = groups[key];
    g.targetValue += r.targetValue || 0;
    g.actualValue += r.actualValue || 0;
    g.standardHours += r.standardHours || 0;
    g.actualHours += r.actualHours || 0;
    g.effectiveHours += r.effectiveHours || 0;
    g._count++;
    // Merge abnormal reasons
    (r.abnormalReasons || []).forEach(function(a) {
      if (!g._reasonMap[a.reason]) {
        g._reasonMap[a.reason] = { reason: a.reason, hours: 0, note: "", data: {} };
      }
      g._reasonMap[a.reason].hours += a.hours || 0;
      if (a.note) {
        g._reasonMap[a.reason].note = g._reasonMap[a.reason].note ? g._reasonMap[a.reason].note + "；" + a.note : a.note;
      }
    });
  });

  // Finalize groups
  return groupOrder.map(function(key) {
    var g = groups[key];
    g.abnormalReasons = Object.values(g._reasonMap);
    // Detect DLE mode from team name (fallback for old records without isDLE flag)
    if (g.teamName === "二部一课" || g.teamName === "二部二课") {
      g.isDLE = true;
    }
    if (g.isDLE) {
      // DLE mode: DLE = effectiveHours / actualHours
      var eh = g.effectiveHours || 0;
      var ah = g.actualHours || 0;
      g.dle = ah > 0 ? eh / ah : 0;
      var dleThr = g.teamName === "二部二课" ? 0.80 : 0.75;
      var expectedHours = dleThr > 0 ? eh / dleThr : ah;
      g.lossGap = ah - expectedHours;
      var totalLoss = g.abnormalReasons.reduce(function(s, a) { return s + a.hours; }, 0);
      g.totalLossAnalyzed = totalLoss;
      g.coverage = g.lossGap > 0 ? (totalLoss / g.lossGap) * 100 : 100;
    } else {
    g.plannedPH = g.standardHours > 0 ? g.targetValue * 10000 / g.standardHours : 0;
    g.actualPH = g.actualHours > 0 ? g.actualValue * 10000 / g.actualHours : 0;
    var tv = g.targetValue, av = g.actualValue, sh = g.standardHours, ah = g.actualHours;
    // When target value < 1万, production comparison is not meaningful; use raw hours gap instead
    g.lowTarget = tv < 1;
    if (g.lowTarget) {
      g.hoursGap = (sh > 0 && ah > 0) ? ah - sh : 0;
    } else {
      g.hoursGap = (tv > 0 && sh > 0 && ah > 0) ? ah - sh * av / tv : 0;
    }
    g.lossGap = g.hoursGap > 0 ? g.hoursGap * 0.9 : 0;
    var totalLoss = g.abnormalReasons.reduce(function(s, a) { return s + a.hours; }, 0);
    g.totalLossAnalyzed = totalLoss;
    g.coverage = g.lossGap > 0 ? (totalLoss / g.lossGap) * 100 : 100;
    }
    return g;
  });
}

// ==================== 人时产值 CALCULATIONS ====================
// Input values are in 万元, formula: 产值(万元) * 10000 / 工时 = 元/工时
function calcPlannedPH() {
  return Number(answers.standardHours) > 0 ? Number(answers.targetValue) * 10000 / Number(answers.standardHours) : 0;
}
function calcActualPH() {
  return Number(answers.actualHours) > 0 ? Number(answers.actualValue) * 10000 / Number(answers.actualHours) : 0;
}
function calcHoursGapSimple() {
  var tv = Number(answers.targetValue) || 0;
  var av = Number(answers.actualValue) || 0;
  var sh = Number(answers.standardHours) || 0;
  var ah = Number(answers.actualHours) || 0;
  if (sh <= 0 || ah <= 0) return 0;
  // When target value < 1万, use simple hours gap instead of proportional formula
  if (tv < 1) return ah - sh;
  if (tv <= 0) return 0;
  var expectedHours = sh * av / tv;
  return ah - expectedHours;
}
function calcLossGap() {
  if (isDLEMode()) {
    var eh = Number(answers.effectiveHours) || 0;
    var ah = Number(answers.actualHours) || 0;
    var thr = getDLEThreshold();
    var expectedHours = thr > 0 ? eh / thr : ah;
    return ah - expectedHours;
  }
  var hoursGap = calcHoursGapSimple();
  return hoursGap * 0.9;
}
function getTotalLossHours() {
  var reasonList = answers.reasonList || [];
  var total = 0;
  reasonList.forEach(function(item) {
    var cat = findCategory(item.reason);
    if (cat) {
      total += cat.calcHours(item.data || {});
    }
  });
  return total;
}
function getCoveragePct() {
  var lossGap = calcLossGap();
  if (lossGap <= 0) return 100;
  return (getTotalLossHours() / lossGap) * 100;
}
function isActualPHBelowPlanned() {
  var tv = Number(answers.targetValue) || 0;
  var av = Number(answers.actualValue) || 0;
  var sh = Number(answers.standardHours) || 0;
  var ah = Number(answers.actualHours) || 0;
  // When target value < 1万, use hours comparison instead of PH comparison
  if (tv < 1) return ah > sh;
  var plannedPH = calcPlannedPH();
  var actualPH = calcActualPH();
  return plannedPH > 0 && actualPH < plannedPH;
}
function fmtPH(n) {
  return n > 0 ? n.toFixed(1) : "—";
}
function isDLEMode() {
  return answers.teamName && (answers.teamName === "二部一课" || answers.teamName === "二部二课");
}
function calcDLE() {
  var eh = Number(answers.effectiveHours) || 0;
  var ah = Number(answers.actualHours) || 0;
  if (ah <= 0) return 0;
  return eh / ah;
}
function getDLEThreshold() {
  if (answers.teamName === "二部二课") return 0.80;
  return 0.75; // 二部一课 default
}
function fmtH(n) {
  return n.toFixed(1) + "h";
}

function setTimeFilter(dimension) {
  dashboardTimeFilter = dimension;
  var now = new Date();
  if (dimension === "day") {
    var d = new Date(); d.setDate(d.getDate()-1);
    dashboardDateFilter = d.toISOString().split("T")[0];
  } else if (dimension === "week") {
    dashboardDateFilter = getISOWeek(now.toISOString().split("T")[0]);
  } else {
    dashboardDateFilter = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  }

  document.querySelectorAll('.time-filter-btn').forEach(function(btn) {

// ==================== DATE PICKER ====================
function renderDatePicker() {
  var wrap = document.getElementById("date-picker-wrap");
  if (!wrap) return;
  if (dashboardTimeFilter === "day") {
    wrap.innerHTML = '<label>选择日期</label><input type="date" class="date-picker-input" id="date-picker-day" />';
    var inp = document.getElementById("date-picker-day");
    if (dashboardDateFilter) inp.value = dashboardDateFilter;
    inp.addEventListener("change", function() {
      dashboardDateFilter = this.value;
      renderDashboard();
    });
  } else if (dashboardTimeFilter === "week") {
    wrap.innerHTML = '<label>选择日期(自动算周)</label><input type="date" class="date-picker-input" id="date-picker-week" />';
    var inp = document.getElementById("date-picker-week");
    // If there's a week filter, show the Monday of that week
    if (dashboardDateFilter) {
      var parts = dashboardDateFilter.split("-W");
      if (parts.length === 2) {
        var jan4 = new Date(parseInt(parts[0]), 0, 4);
        var monWeek1 = new Date(jan4);
        monWeek1.setDate(jan4.getDate() - (jan4.getDay() + 6) % 7);
        var monday = new Date(monWeek1);
        monday.setDate(monWeek1.getDate() + (parseInt(parts[1]) - 1) * 7);
        inp.value = monday.toISOString().split("T")[0];
      }
    }
    inp.addEventListener("change", function() {
      dashboardDateFilter = getISOWeek(this.value);
      renderDashboard();
    });
  } else {
    wrap.innerHTML = '<label>选择月份</label><input type="month" class="date-picker-input" id="date-picker-month" />';
    var inp = document.getElementById("date-picker-month");
    if (dashboardDateFilter) inp.value = dashboardDateFilter;
    inp.addEventListener("change", function() {
      dashboardDateFilter = this.value;
      renderDashboard();
    });
  }
}

// ==================== INTERVIEW RENDER ====================
function renderInterview() {
  var visibleQs = getVisibleQuestions();
  const totalSteps = visibleQs.length + 4; // +PH/DLE analysis, +reason selection, +reason details, +more analysis (if needed)
  const progress = ((currentStep + 1) / (totalSteps + 1)) * 100;
  document.getElementById("progress-fill").style.width = progress + "%";

  // Update sub title
  let subText = "";
  if (currentStep < visibleQs.length) {
    subText = "第 " + (currentStep+1) + " 题 / 共 " + visibleQs.length + " 题";
  } else if (currentStep === visibleQs.length) {
    subText = isDLEMode() ? "DLE分析" : "人时产值分析";
  } else if (currentStep === visibleQs.length + 1) {
    subText = isAddingMore ? "补充异常原因" : "异常原因";
  } else if (currentStep === visibleQs.length + 2) {
    subText = isAddingMore ? "补充工时详情" : "工时详情";
  } else if (currentStep === visibleQs.length + 3) {
    subText = "差距分析";
  } else {
    subText = "采访完成";
  }
  document.getElementById("interview-sub").textContent = subText;

  // Render chat history - rebuild to reflect latest answers
  const chatHistory = document.getElementById("chat-history");
  chatHistory.innerHTML = "";
  for (let i = 0; i < Math.min(currentStep, visibleQs.length); i++) {
    const q = visibleQs[i];
    const val = answers[q.id];
    let displayVal = val;
    if (q.inputType === "number") {
      if (q.id.includes("Value")) displayVal = fmtW(val);
      else displayVal = (val !== undefined && val !== "") ? val + " 小时" : "—";
    }
    chatHistory.innerHTML += '<div class="chat-msg question"><div class="chat-bubble">'+q.label+'</div></div>';
    chatHistory.innerHTML += '<div class="chat-msg answer"><div class="chat-bubble">'+(displayVal !== undefined && displayVal !== "" ? displayVal : "—")+'</div></div>';
  }
  // Add PH/DLE analysis to chat if past analysis step
  if (currentStep > visibleQs.length) {
    if (isDLEMode()) {
      var dle = calcDLE();
      var thr = getDLEThreshold();
      var thrPct = (thr * 100).toFixed(0);
      chatHistory.innerHTML += '<div class="chat-msg question"><div class="chat-bubble">DLE分析：有效工时 '+fmtH(Number(answers.effectiveHours)||0)+' / 实际工时 '+fmtH(Number(answers.actualHours)||0)+' = '+(dle*100).toFixed(1)+'%</div></div>';
      if (dle < thr) {
        chatHistory.innerHTML += '<div class="chat-msg answer"><div class="chat-bubble">DLE低于'+thrPct+'%，需进行异常分析</div></div>';
      } else {
        chatHistory.innerHTML += '<div class="chat-msg answer"><div class="chat-bubble">DLE达到或超过'+thrPct+'%，无需异常分析</div></div>';
      }
    } else {
      var plannedPH = calcPlannedPH();
      var actualPH = calcActualPH();
      var compRate = pctNum(answers.actualValue, answers.targetValue);
      chatHistory.innerHTML += '<div class="chat-msg question"><div class="chat-bubble">人时产值分析：计划 '+fmtPH(plannedPH)+' vs 实际 '+fmtPH(actualPH)+'，达成率 '+compRate.toFixed(1)+'%</div></div>';
      if (isActualPHBelowPlanned()) {
        var hoursGap = calcHoursGapSimple();
        var lossGap = calcLossGap();
        chatHistory.innerHTML += '<div class="chat-msg answer"><div class="chat-bubble">实际低于计划，工时差距 '+hoursGap.toFixed(1)+' 小时</div></div>';
      } else {
        chatHistory.innerHTML += '<div class="chat-msg answer"><div class="chat-bubble">实际达到或超过计划，无需异常分析</div></div>';
      }
    }
  }
  // Add reason/answer history if we've passed reason selection
  if (currentStep > visibleQs.length + 1) {
    var reasonList = answers.reasonList || [];
    let reasonText = "无异常";
    if (reasonList.length > 0) {
      reasonText = reasonList.map(function(item) {
        var cat = findCategory(item.reason);
        var hours = cat ? cat.calcHours(item.data || {}) : 0;
        var note = item.note || "";
        return item.reason + "（" + hours.toFixed(1) + "小时" + (note ? "，" + note : "") + "）";
      }).join("、");
    }
    chatHistory.innerHTML += '<div class="chat-msg question"><div class="chat-bubble">是否存在以下异常原因？</div></div>';
    chatHistory.innerHTML += '<div class="chat-msg answer"><div class="chat-bubble">'+reasonText+'</div></div>';
  }
  // Render current question card
  const card = document.getElementById("question-card");
  if (currentStep < visibleQs.length) {
    const q = visibleQs[currentStep];
    currentQid = q.id; // set global for input handler
    var inputHtml = '';
    if (q.inputType === 'select') {
      inputHtml = '<select class="question-input" id="current-input" style="appearance:auto;cursor:pointer" autofocus>';
      inputHtml += '<option value="">'+q.placeholder+'</option>';
      TEAM_OPTIONS.forEach(function(opt) {
        inputHtml += '<option value="'+opt+'"'+(answers[q.id]===opt?' selected':'')+'>'+opt+'</option>';
      });
      inputHtml += '</select>';
    } else {
      var defaultVal = answers[q.id] || "";
      if (q.id === "date" && !defaultVal) {
        defaultVal = new Date(Date.now() - 86400000).toISOString().split('T')[0];
        answers[q.id] = defaultVal;
      }
      inputHtml = '<input class="question-input" type="'+q.inputType+'" placeholder="'+q.placeholder+'" value="'+defaultVal+'" id="current-input" autofocus/>';
    }
    card.innerHTML = '<div class="question-header"><div class="question-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><span class="question-label">'+q.label+'</span></div>'+inputHtml+'<div id="nav-container"></div>';
    // Attach event listeners via addEventListener (CSP-safe)
    var inputEl = document.getElementById("current-input");
    if (q.inputType === 'select') {
      inputEl.addEventListener('change', function() { onMainInput(this); });
    } else {
      inputEl.addEventListener('input', function() { onMainInput(this); });
      inputEl.addEventListener('keydown', function(e) { if(e.key==='Enter'&&canProceed()) goNext(); });
    }
    if (q.inputType !== 'select') {
      setTimeout(() => document.getElementById("current-input").focus(), 50);
    }
    renderNavButtons();
  } else if (currentStep === visibleQs.length) {
    renderPHAnalysis();
  } else if (currentStep === visibleQs.length + 1) {
    renderReasonSelection();
  } else if (currentStep === visibleQs.length + 2) {
    renderReasonDetails();
  } else if (currentStep === visibleQs.length + 3) {
    renderMoreAnalysis();
  } else {
    renderCompletion();
  }
  // Auto-scroll to the current question card so it's always visible on mobile
  setTimeout(function() {
    var card = document.getElementById("question-card");
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, 100);
}

function renderPHAnalysis() {
  var card = document.getElementById("question-card");
  var html = '';

  if (isDLEMode()) {
    // DLE mode analysis
    var dle = calcDLE();
    var dlePct = (dle * 100).toFixed(1);
    var threshold = getDLEThreshold();
    var thresholdPct = (threshold * 100).toFixed(0);

    var eh = Number(answers.effectiveHours) || 0;
    var ah = Number(answers.actualHours) || 0;

    html += '<div class="question-header"><div class="question-icon'+(belowThreshold?' danger':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="'+(belowThreshold?'#DC2626':'#10B981')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div><span class="question-label">DLE分析</span></div>';

    var eh = Number(answers.effectiveHours) || 0;

    var expectedHours = thr > 0 ? eh / thr : ah;

    html += '<div class="analysis-item"><div class="analysis-item-label">计划DLE</div><div class="analysis-item-value" style="color:#4F46E5">'+thrPct+'%</div><div class="analysis-item-sub">'+(answers.teamName === "二部二课" ? "二部二课标准" : "二部一课标准")+'</div></div>';
    html += '<div class="analysis-item"><div class="analysis-item-label">实际DLE</div><div class="analysis-item-value" style="color:'+(dle<thr?'#EF4444':'#10B981')+'">'+dlePct+'%</div><div class="analysis-item-sub">有效工时/实际工时</div></div>';
    html += '</div>';
    html += '<div style="padding:10px 14px;background:#FEF2F2;border-radius:10px;margin-bottom:12px;font-size:13px;color:#991B1B">工时差距：<strong>'+dleHoursGap.toFixed(1)+'</strong> 小时（实际工时 '+ah+'h − 有效工时 '+eh+'h / '+thrPct+'%）</div>';
    html += '<div class="coverage-bar-wrap"><div class="coverage-text" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;color:#6B7280">已分析覆盖率（需≥90%）</span><span style="font-size:13px;font-weight:700;color:'+covColor+'">'+totalLoss.toFixed(1)+' / '+dleHoursGap.toFixed(1)+' 小时 ('+cov.toFixed(0)+'%)</span></div><div class="coverage-bar"><div class="coverage-bar-fill" style="width:'+Math.min(cov,100)+'%;background:'+covColor+'"></div></div></div>';
  } else if (isActualPHBelowPlanned()) {
    var plannedPH = calcPlannedPH();
    var actualPH = calcActualPH();
    var hoursGap = calcHoursGapSimple();
    var lossGap = calcLossGap();
    var totalLoss = getTotalLossHours();
    var cov = getCoveragePct();
    var covColor = cov >= 90 ? '#10B981' : cov >= 60 ? '#F59E0B' : '#EF4444';
    html += '<div class="analysis-grid">';
    html += '<div class="analysis-item'+(actualPH<plannedPH?' warn':' ok')+'"><div class="analysis-item-label">计划人时产值</div><div class="analysis-item-value" style="color:#4F46E5">'+fmtPH(plannedPH)+'</div><div class="analysis-item-sub">元/工时</div></div>';
    html += '<div class="analysis-item'+(actualPH<plannedPH?' warn':' ok')+'"><div class="analysis-item-label">实际人时产值</div><div class="analysis-item-value" style="color:'+(actualPH<plannedPH?'#EF4444':'#10B981')+'">'+fmtPH(actualPH)+'</div><div class="analysis-item-sub">元/工时</div></div>';
    html += '</div>';
    html += '<div style="padding:10px 14px;background:#FEF2F2;border-radius:10px;margin-bottom:12px;font-size:13px;color:#991B1B">工时差距：<strong>'+hoursGap.toFixed(1)+'</strong> 小时</div>';
    html += '<div class="coverage-bar-wrap"><div class="coverage-text" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;color:#6B7280">已分析覆盖率</span><span style="font-size:13px;font-weight:700;color:'+covColor+'">'+totalLoss.toFixed(1)+' / '+lossGap.toFixed(1)+' 小时 ('+cov.toFixed(0)+'%)</span></div><div class="coverage-bar"><div class="coverage-bar-fill" style="width:'+Math.min(cov,100)+'%;background:'+covColor+'"></div></div></div>';
  }

  // Group reason in reasonList by category, preserving order
  REASON_CATEGORIES.forEach(function(cat) {
    // Find all reasonList items that belong to this category
    var catItems = [];
    reasonList.forEach(function(item, idx) {
      if (cat.options.indexOf(item.reason) >= 0) {
        catItems.push({ item: item, idx: idx });
      }
    });
    if (catItems.length === 0) return;

    html += '<div style="margin-bottom:16px">';
    html += '<div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #E5E7EB">'+cat.label+' <span style="font-size:12px;color:#9CA3AF;font-weight:400">'+cat.desc+'</span></div>';

    catItems.forEach(function(entry) {
      var r = entry.item.reason;
      var idx = entry.idx;
      var rd = entry.item.data || {};
      var noteVal = entry.item.note || "";
      var color = REASON_COLORS[r] || '#6B7280';

      html += '<div class="reason-detail-item" style="flex-direction:column;align-items:stretch;margin-bottom:12px;padding:14px;border:1px solid '+color+'30;border-radius:12px;background:'+color+'08">';

      // Show calculated hours
      var calcH = cat.calcHours(rd);
      html += '<span style="margin-left:auto;font-size:13px;font-weight:700;color:'+color+'">合计：<span id="calc-hours-'+idx+'">'+(calcH>0?calcH.toFixed(1):'0')+'</span> 小时</span>';

      // Input fields based on category
      cat.fields.forEach(function(f) {

        } else {
          html += '<input class="reason-field-input" type="number" placeholder="请输入'+label+'" value="'+val+'" style="--reason-color:'+color+'" id="reason-field-'+idx+'-'+f+'" data-idx="'+idx+'" data-field="'+f+'"/>';
        }
        html += '</div>';
      });

      // Note textarea - use reason-specific placeholder
      var notePh = (cat.notePlaceholders && cat.notePlaceholders[r]) || "请说明具体原因";
      html += '<div style="display:flex;align-items:flex-start;gap:8px;margin-top:4px">';
      html += '<label style="font-size:13px;color:#6B7280;min-width:120px;padding-top:8px">备注说明</label>';
      html += '<textarea class="reason-detail-note" placeholder="'+notePh+'" style="--reason-color:'+color+'" id="reason-note-'+idx+'" data-idx="'+idx+'">'+noteVal+'</textarea>';
      html += '</div>';

      html += '</div>';
    });
    html += '</div>';
  });

  const totalLoss2 = getTotalLossHours();
  html += '<div class="loss-total">损失工时合计：<strong>'+totalLoss2.toFixed(1)+'</strong> 小时</div>';

  // Validation status feedback
  var _canGo = canProceed();
  if (!_canGo && reasonList.length > 0) {
    var _incomplete = [];
    reasonList.forEach(function(item) {
      var cat = findCategory(item.reason);
      if (!cat) return;
      var rd = item.data || {};
      var missing = [];
      cat.fields.forEach(function(f) {
        var val = rd[f];
        if (f === 'productModel') { if (val === undefined || (typeof val === 'string' && val.trim() === "")) missing.push(cat.fieldLabels[f]); }
        else { if (val === undefined || val === "" || Number(val) <= 0) missing.push(cat.fieldLabels[f]); }
      });
      var note = item.note;
      if (note === undefined || (typeof note === 'string' && note.trim() === "")) missing.push("备注说明");
      if (missing.length > 0) _incomplete.push({ reason: item.reason, missing: missing });
    });
    if (_incomplete.length > 0) {
      html += '<div id="validation-msg" style="margin-top:10px;padding:10px 14px;background:#FEF3C7;border-radius:10px;font-size:12px;color:#92400E;border:1px solid #FDE68A">';
      html += '<div style="font-weight:600;margin-bottom:4px">以下原因信息不完整：</div>';
      _incomplete.forEach(function(item) {
        html += '<div style="margin-top:2px">• '+item.reason+'：还需填写 '+item.missing.join('、')+'</div>';
      });
      html += '</div>';
    } else if (isActualPHBelowPlanned() && getCoveragePct() < 90) {
      html += '<div id="validation-msg" style="margin-top:10px;padding:10px 14px;background:#FEF3C7;border-radius:10px;font-size:12px;color:#92400E;border:1px solid #FDE68A">';
      html += '覆盖率需达到 90% 才能继续，当前 '+getCoveragePct().toFixed(0)+'%，请点击下方"添加更多损失原因"补充分析';
      html += '</div>';
    }
  }

  html += '<div id="nav-container"></div>';
  card.innerHTML = html;

  // Event delegation for reason field inputs (uses data-idx instead of data-reason)
  card.addEventListener('input', function(e) {
    var t = e.target;
    if (t.classList.contains('reason-field-input')) {
      onReasonFieldInput(t, Number(t.getAttribute('data-idx')), t.getAttribute('data-field'));
    } else if (t.classList.contains('reason-detail-note')) {
      onNoteInput(t, Number(t.getAttribute('data-idx')));
    }
  });
  card.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.classList.contains('reason-field-input') && canProceed()) {
      goNext();
    }
  });

  // Focus first input
  if (reasonList.length > 0) {
    setTimeout(function() {
      var firstItem = reasonList[0];
      var firstCat = findCategory(firstItem.reason);
      if (firstCat) {
        var firstField = firstCat.fields[0];
        var firstInput = document.getElementById("reason-field-0-" + firstField);
        if (firstInput) firstInput.focus();
      }
    }, 50);
  }

  // Render nav buttons (will be dynamically updated by renderNavButtons on input)
  renderNavButtons();
}

function addMoreReasons() {

  renderInterview();

// Save all form field values to answers.reasonList before re-rendering
function saveReasonFieldValues() {
  var reasonList = answers.reasonList || [];
  // Save all reason field inputs
  document.querySelectorAll('.reason-field-input').forEach(function(input) {
    var idx = Number(input.getAttribute('data-idx'));
    var field = input.getAttribute('data-field');
    if (idx >= 0 && idx < reasonList.length && field) {
      if (!reasonList[idx].data) reasonList[idx].data = {};
      reasonList[idx].data[field] = input.type === 'number' ? Number(input.value) : input.value;
    }
  });
  // Save all reason note textareas
  document.querySelectorAll('.reason-detail-note').forEach(function(textarea) {
    var idx = Number(textarea.getAttribute('data-idx'));
    if (idx >= 0 && idx < reasonList.length) {
      reasonList[idx].note = textarea.value;
    }
  });
}

// Add a new reason entry to reasonList and re-render the reason details
function toggleReason(reasonName) {
  if (selectedReasons.has(reasonName)) {
    selectedReasons.delete(reasonName);
  } else {
    selectedReasons.add(reasonName);
  }
  renderReasonSelection();
}

function pickNewReason(reasonName) {
  // Save current form values before adding new reason
  saveReasonFieldValues();

  if (!answers.reasonList) answers.reasonList = [];
  answers.reasonList.push({ id: genReasonId(), reason: reasonName, data: {}, note: "" });
  // Re-render reason details to show the new card
  renderReasonDetails();
}

// Check if ALL questions and reason details have been answered (for completion screen validation)
function isAllAnswered() {
  var visibleQs = getVisibleQuestions();
  // Check all main questions
  for (var i = 0; i < visibleQs.length; i++) {
    var val = answers[visibleQs[i].id];
    if (val === undefined || val === "") return false;
  }
  // Check all reason details
  var reasonList = answers.reasonList || [];
  for (var j = 0; j < reasonList.length; j++) {
    var item = reasonList[j];
    var cat = findCategory(item.reason);
    if (!cat) return false;
    var rd = item.data || {};
    for (var k = 0; k < cat.fields.length; k++) {
      var f = cat.fields[k];
      var fval = rd[f];
      if (f === 'productModel') {
        if (fval === undefined || (typeof fval === 'string' && fval.trim() === "")) return false;
      } else {
        if (fval === undefined || fval === "" || Number(fval) <= 0) return false;
      }
    }
    var note = item.note;
    if (note === undefined || (typeof note === 'string' && note.trim() === "")) return false;
  }
  return true;
}

      var mitem = reasonList[mj];
      var mcat = findCategory(mitem.reason);
      if (!mcat) continue;
      var mrd = mitem.data || {};
      var mfields = mcat.fields || [];
      for (var mk = 0; mk < mfields.length; mk++) {
        var mf = mfields[mk];
        var mfval = mrd[mf];
        if (mf === 'productModel') {
          if (mfval === undefined || (typeof mfval === 'string' && mfval.trim() === "")) missingList.push(mitem.reason + ' - ' + (mcat.fieldLabels[mf] || mf));
        } else {
          if (mfval === undefined || mfval === "" || Number(mfval) <= 0) missingList.push(mitem.reason + ' - ' + (mcat.fieldLabels[mf] || mf));
        }
      }
      var mnote = mitem.note;
      if (mnote === undefined || (typeof mnote === 'string' && mnote.trim() === "")) missingList.push(mitem.reason + ' - 备注说明');
    }
    html += '<div style="margin:12px 0;padding:12px 14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;text-align:left">';
    html += '<div style="font-size:13px;font-weight:700;color:#991B1B;margin-bottom:6px">⚠️ 还有内容未填写，无法提交：</div>';
    html += '<div style="font-size:12px;color:#B91C1C;line-height:1.6;max-height:120px;overflow-y:auto">';
    for (var mm = 0; mm < missingList.length; mm++) {
      html += '<div>• ' + missingList[mm] + '</div>';
    }
    html += '</div></div>';
    html += '<button class="btn-submit" disabled style="opacity:0.5;cursor:not-allowed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> 请先完成所有问题</button>';
    html += '<button class="btn-submit" data-action="goBackToMissing" style="background:#F59E0B;margin-top:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> 返回修改</button>';
  } else if (isSubmitted) {
    html += '<button class="btn-submit" disabled style="opacity:0.5;cursor:not-allowed;background:#9CA3AF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已提交</button>';
  } else {
    html += '<button class="btn-submit" data-action="submitInterview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> 提交并查看看板</button>';
  }
  html += '</div>';
  card.innerHTML = html;
}

function renderNavButtons() {
  const navContainer = document.getElementById("nav-container");
  if (!navContainer) return;
  var visibleQs = getVisibleQuestions();
  // Skip nav for step that renders its own custom buttons
  if (currentStep === visibleQs.length + 3) return;
  const isLastMain = currentStep === visibleQs.length - 1;
  const isReasonDetails = currentStep === visibleQs.length + 2;
  let html = '<div class="nav-buttons"><button class="btn-nav btn-prev"'+(currentStep===0?' disabled':'')+' data-action="goPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> '+(isReasonDetails ? '上一步' : '上一题')+'</button>';
  if (isLastMain) {
    html += '<button class="btn-nav btn-next primary"'+(canProceed()?'':' disabled')+' data-action="goNext">下一题 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>';
  } else {
    html += '<button class="btn-nav btn-next'+(isReasonDetails?' primary':'')+'"'+(canProceed()?'':' disabled')+' data-action="goNext">下一题 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>';
  }
  html += '</div>';
  navContainer.innerHTML = html;
  // Update validation message for reason details step
  if (isReasonDetails) {
    var valMsg = document.getElementById("validation-msg");
    if (valMsg) {
      var canGo = canProceed();
      if (!canGo) {
        var reasonList = answers.reasonList || [];
        var _incomplete = [];
        reasonList.forEach(function(item) {
          var cat = findCategory(item.reason);
          if (!cat) return;
          var rd = item.data || {};
          var missing = [];
          cat.fields.forEach(function(f) {
            var val = rd[f];
            if (f === 'productModel') { if (val === undefined || (typeof val === 'string' && val.trim() === "")) missing.push(cat.fieldLabels[f]); }
            else { if (val === undefined || val === "" || Number(val) <= 0) missing.push(cat.fieldLabels[f]); }
          });
          var note = item.note;
          if (note === undefined || (typeof note === 'string' && note.trim() === "")) missing.push("备注说明");
          if (missing.length > 0) _incomplete.push({ reason: item.reason, missing: missing });
        });
        if (_incomplete.length > 0) {
          var msgHtml = '<div style="font-weight:600;margin-bottom:4px">以下原因信息不完整：</div>';
          _incomplete.forEach(function(item) {
            msgHtml += '<div style="margin-top:2px">• '+item.reason+'：还需填写 '+item.missing.join('、')+'</div>';
          });
          valMsg.innerHTML = msgHtml;
          valMsg.style.display = '';
        }
      } else {
        valMsg.style.display = 'none';
      }
    }
  }
}

// ==================== INTERVIEW LOGIC ====================
// Global input handler - called from oninput attribute, uses currentQid global
function onMainInput(el) {
  var visibleQs = getVisibleQuestions();
  var q = visibleQs[currentStep];
  if (q.inputType === "number") {
    answers[q.id] = el.value === "" ? "" : Number(el.value);
  } else {
    answers[q.id] = el.value;
  }
  renderNavButtons();
}

// Global handler for reason detail field inputs (uses reasonList index)
function onReasonFieldInput(el, idx, fieldName) {
  var reasonList = answers.reasonList || [];
  if (idx < 0 || idx >= reasonList.length) return;
  var item = reasonList[idx];
  var cat = findCategory(item.reason);
  if (!cat) return;
  if (!item.data) item.data = {};
  var isText = fieldName === 'productModel';
  item.data[fieldName] = isText ? el.value : (el.value === "" ? "" : Number(el.value));

  var calcEl = document.getElementById("calc-hours-" + idx);
  if (calcEl) {
    var h = cat.calcHours(item.data);
    calcEl.textContent = h > 0 ? h.toFixed(1) : '0';
  }
  updateCoverageDisplay();
  renderNavButtons();
}

// Global handler for reason notes (uses reasonList index)
function onNoteInput(el, idx) {
  var reasonList = answers.reasonList || [];
  if (idx < 0 || idx >= reasonList.length) return;
  reasonList[idx].note = el.value;
  updateCoverageDisplay();
  renderNavButtons();
}

// Update coverage bar and total without re-rendering inputs (preserves focus)
function updateCoverageDisplay() {
  var reasonList = answers.reasonList || [];
  var totalLoss = 0;
  reasonList.forEach(function(item) {
    var cat = findCategory(item.reason);
    if (cat) {
      totalLoss += cat.calcHours(item.data || {});
    }
  });

  // Update coverage bar if in 人时产值 mode
  if (!isActualPHBelowPlanned()) return;
  var lossGap = calcLossGap();
  var cov = getCoveragePct();
  var covColor = cov >= 90 ? '#10B981' : cov >= 60 ? '#F59E0B' : '#EF4444';
  var barFills = document.querySelectorAll('.coverage-bar-fill');
  barFills.forEach(function(el) { el.style.width = Math.min(cov,100)+'%'; el.style.background = covColor; });
  var covTexts = document.querySelectorAll('.coverage-text');
  covTexts.forEach(function(el) { el.innerHTML = '<span style="font-size:13px;color:#6B7280">已分析覆盖率</span><span style="font-size:13px;font-weight:700;color:'+covColor+'">'+totalLoss.toFixed(1)+' / '+lossGap.toFixed(1)+' 小时 ('+cov.toFixed(0)+'%)</span>'; });
  // Update validation message
  var msgEl = document.getElementById("validation-msg");
  if (msgEl) {
    var _canGo = canProceed();
    if (_canGo) {
      msgEl.style.display = "none";
    } else {
      var _incomplete = [];
      reasonList.forEach(function(item) {
        var cat = findCategory(item.reason);
        if (!cat) return;
        var rd = item.data || {};
        var missing = [];
        cat.fields.forEach(function(f) {
          var val = rd[f];
          if (f === 'productModel') { if (val === undefined || (typeof val === 'string' && val.trim() === "")) missing.push(cat.fieldLabels[f]); }
          else { if (val === undefined || val === "" || Number(val) <= 0) missing.push(cat.fieldLabels[f]); }
        });
        var note = item.note;
        if (note === undefined || (typeof note === 'string' && note.trim() === "")) missing.push("备注说明");
        if (missing.length > 0) _incomplete.push({ reason: item.reason, missing: missing });
      });
      if (_incomplete.length > 0) {
        var msg = '<div style="font-weight:600;margin-bottom:4px">以下原因信息不完整：</div>';
        _incomplete.forEach(function(item) { msg += '<div style="margin-top:2px">• '+item.reason+'：还需填写 '+item.missing.join('、')+'</div>'; });
        msgEl.innerHTML = msg;
      } else if (isActualPHBelowPlanned() && getCoveragePct() < 90) {
        msgEl.innerHTML = '覆盖率需达到 90% 才能继续，当前 '+getCoveragePct().toFixed(0)+'%，请点击下方"添加更多损失原因"补充分析';
      }
      msgEl.style.display = "";
    }
  }
}

function canProceed() {
  var visibleQs = getVisibleQuestions();
  if (currentStep < visibleQs.length) {
    const val = answers[visibleQs[currentStep].id];
    return val !== undefined && val !== "";
  }
  if (currentStep === visibleQs.length) return true; // PH/DLE analysis always proceeds
  if (currentStep === visibleQs.length + 1) return true; // reason selection always proceeds
  if (currentStep === visibleQs.length + 2) {
    var reasonList = answers.reasonList || [];
    if (reasonList.length === 0) return true; // no reasons to validate
    var allFilled = reasonList.every(function(item) {
      var cat = findCategory(item.reason);
      if (!cat) return false;
      var rd = item.data || {};
      var fieldsOk = cat.fields.every(function(f) {
        var val = rd[f];
        if (f === 'productModel') return val !== undefined && val.trim() !== "";
        return val !== undefined && val !== "" && Number(val) > 0;
      });
      var note = item.note;
      var noteOk = note !== undefined && note.trim() !== "";
      return fieldsOk && noteOk;
    });
    if (!allFilled) return false;
    return true;
  }
  if (currentStep === visibleQs.length + 3) {
    return getCoveragePct() >= 90;
  }
  return true;
}

function goNext() {
  var visibleQs = getVisibleQuestions();
  if (currentStep < visibleQs.length) {
    const q = visibleQs[currentStep];
    const input = document.getElementById("current-input");
    if (input && input.value !== "") {
      if (q.inputType === "number") {
        answers[q.id] = Number(input.value);
      } else {
        answers[q.id] = input.value.trim();
      }
    }
  }
  if (currentStep === visibleQs.length) {
    // PH/DLE analysis step - branch based on comparison
    if (isDLEMode()) {
      if (calcDLE() < getDLEThreshold()) {
        currentStep = visibleQs.length + 1; // go to reason selection
      } else {
        currentStep = visibleQs.length + 4; // skip to completion
      }
    } else {
      if (isActualPHBelowPlanned()) {
        currentStep = visibleQs.length + 1; // go to reason selection
      } else {
        currentStep = visibleQs.length + 4; // skip to completion
      }
    }
  } else if (currentStep === visibleQs.length + 1) {
    // Reason selection step - batch add all selected reasons
    if (isAddingMore) {
      isAddingMore = false;
      currentStep = visibleQs.length + 2; // go back to reason details
    } else {
      // Add all selected reasons to reasonList
      if (selectedReasons.size > 0) {
        if (!answers.reasonList) answers.reasonList = [];
        selectedReasons.forEach(function(r) {
          answers.reasonList.push({ id: genReasonId(), reason: r, data: {}, note: "" });
        });
        selectedReasons.clear();
      }
      var reasonList = answers.reasonList || [];
      if (reasonList.length === 0) {
        currentStep = visibleQs.length + 4; // skip to completion (no reasons)
      } else {
        currentStep++;
      }
    }
  } else if (currentStep === visibleQs.length + 2) {
    // Reason details step - save form values before navigating away
    saveReasonFieldValues();
    if ((isDLEMode() ? calcDLE() < getDLEThreshold() : isActualPHBelowPlanned()) && getCoveragePct() < 90) {
      currentStep = visibleQs.length + 3; // go to more analysis
    } else {
      currentStep = visibleQs.length + 4; // go to completion
    }
  } else {
    currentStep++;
  }
  renderInterview();
}

function goPrev() {
  var visibleQs = getVisibleQuestions();
  if (currentStep > 0) {
    // Save form values if we're on the reason details step
    if (currentStep === visibleQs.length + 2) {
      saveReasonFieldValues();
    }
    currentStep--;
    renderInterview();
  }
}

// Navigate back to the first unanswered question or incomplete reason detail
function goBackToMissing() {
  var visibleQs = getVisibleQuestions();
  // Check main questions
  for (var i = 0; i < visibleQs.length; i++) {
    var val = answers[visibleQs[i].id];
    if (val === undefined || val === "") {
      currentStep = i;
      renderInterview();
      return;
    }
  }
  // Check reason details
  var reasonList = answers.reasonList || [];
  for (var j = 0; j < reasonList.length; j++) {
    var item = reasonList[j];
    var cat = findCategory(item.reason);
    if (!cat) continue;
    var rd = item.data || {};
    var hasMissing = false;
    for (var k = 0; k < cat.fields.length; k++) {
      var f = cat.fields[k];
      var fval = rd[f];
      if (f === 'productModel') {
        if (fval === undefined || (typeof fval === 'string' && fval.trim() === "")) hasMissing = true;
      } else {
        if (fval === undefined || fval === "" || Number(fval) <= 0) hasMissing = true;
      }
    }
    var note = item.note;
    if (note === undefined || (typeof note === 'string' && note.trim() === "")) hasMissing = true;
    if (hasMissing) {
      currentStep = visibleQs.length + 2; // go to reason details step
      renderInterview();
      return;
    }
  }
}

function submitInterview() {
  if (isSubmitted) return; // prevent duplicate submissions
  if (!isAllAnswered()) return; // safety check: all questions must be answered
  isSubmitted = true;
  var reasonList = answers.reasonList || [];
  var isDLE = isDLEMode();
  // Convert reasonList to abnormalReasons array format for storage
  var abnormalReasons = reasonList.map(function(item) {
    var cat = findCategory(item.reason);
    var hours = cat ? cat.calcHours(item.data || {}) : 0;
    return { reason: item.reason, hours: hours, note: item.note || "", data: item.data || {} };
  });
  var totalLoss = getTotalLossHours();

  var record;
  if (isDLE) {
    // DLE mode record
    var dle = calcDLE();
    var eh = Number(answers.effectiveHours) || 0;
    var ah = Number(answers.actualHours) || 0;
    var thr = getDLEThreshold();
    var expectedHours = thr > 0 ? eh / thr : ah;
    // For DLE mode, lossGap = actualHours - effectiveHours/threshold
    var dleLossGap = ah - expectedHours;
    var coverage = dleLossGap > 0 ? (totalLoss / dleLossGap) * 100 : 100;
    record = {
      id: Date.now(),
      submitTime: new Date().toLocaleString("zh-CN", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false }),
      teamName: answers.teamName,
      date: answers.date,
      targetValue: 0,
      actualValue: 0,
      standardHours: 0,
      actualHours: ah,
      effectiveHours: eh,
      attendanceHours: 0,
      dle: dle,
      abnormalReasons: abnormalReasons,
      plannedPH: 0,
      actualPH: 0,
      hoursGap: 0,
      lossGap: dleLossGap,
      totalLossAnalyzed: totalLoss,
      coverage: coverage,
      isDLE: true,
    };
  } else {
    // Normal mode record
    var plannedPH = calcPlannedPH();
    var actualPH = calcActualPH();
    var hoursGap = calcHoursGapSimple();
    var lossGap = calcLossGap();
    var coverage = getCoveragePct();
    record = {
      id: Date.now(),
      submitTime: new Date().toLocaleString("zh-CN", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false }),
      teamName: answers.teamName,
      date: answers.date,
      targetValue: Number(answers.targetValue),
      actualValue: Number(answers.actualValue),
      standardHours: Number(answers.standardHours),
      actualHours: Number(answers.actualHours),
      abnormalReasons: abnormalReasons,
      plannedPH: plannedPH,
      actualPH: actualPH,
      hoursGap: hoursGap,
      lossGap: lossGap,
      totalLossAnalyzed: totalLoss,
      coverage: coverage,
      isDLE: false,
    };
  }
  records.push(record);
  saveRecords();
  sendDingTalkNotification(record);
  uploadRecordToCloud(record);
  showDashboard();

  // Show warning after submission in preview mode
  if (isPreviewMode) {
    setTimeout(function() {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#FEF2F2;border:2px solid #EF4444;border-radius:12px;padding:14px 24px;z-index:10000;max-width:500px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.15);font-size:13px;color:#991B1B;line-height:1.6;';
      toast.innerHTML = '<div style="font-weight:700;margin-bottom:6px;">⚠️ 数据已提交，但刷新页面后会丢失！</div>' +
        '<div>建议立即备份数据，然后在其他浏览器中恢复。</div>' +
        '<div style="margin-top:10px;display:flex;gap:8px;justify-content:center;">' +
        '<button onclick="backupData();this.parentElement.parentElement.remove()" style="padding:6px 16px;border-radius:6px;border:none;background:#059669;color:#fff;font-size:12px;font-weight:600;cursor:pointer;">立即备份</button>' +
        '<button onclick="this.parentElement.parentElement.remove()" style="padding:6px 16px;border-radius:6px;border:1px solid #EF4444;background:#fff;color:#EF4444;font-size:12px;font-weight:600;cursor:pointer;">稍后处理</button>' +
        '</div>';
      document.body.appendChild(toast);
    }, 300);
  }
}

function downloadFile() {

    a.download = 'team-interview-bot.html';
