// ==================== DATA BACKUP / RESTORE ====================
function backupData() {
  if (records.length === 0) {
    alert("暂无数据可备份");
    return;
  }
  try {
    var json = JSON.stringify(records, null, 2);
    var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var now = new Date();
    var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    a.href = url;
    a.download = 'interview-data-' + dateStr + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  } catch(e) {
    // Fallback: show JSON in a modal for manual copy
    var json = JSON.stringify(records, null, 2);
    showExportModal(json);
  }
}

function restoreData() {
  // Create a hidden file input for the user to pick a JSON file
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) {
          alert("文件格式不正确，请选择之前备份的 JSON 文件。");
          return;
        }
        // Merge: add records that don't already exist (by id), update existing ones
        var existingIds = {};
        records.forEach(function(r) { existingIds[r.id] = true; });
        var added = 0, updated = 0;
        data.forEach(function(r) {
          if (existingIds[r.id]) {
            // Update existing record
            for (var i = 0; i < records.length; i++) {
              if (records[i].id === r.id) {
                records[i] = r;
                updated++;
                break;
              }
            }
          } else {
            records.push(r);
            added++;
          }
        });
        saveRecords();
        showDashboard();
        var msg = "数据恢复成功！";
        if (added > 0) msg += " 新增 " + added + " 条记录。";
        if (updated > 0) msg += " 更新 " + updated + " 条记录。";
        alert(msg);
      } catch(err) {
        alert("文件解析失败，请确认是有效的 JSON 备份文件。\n错误：" + err.message);
      }
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);
  input.click();
  setTimeout(function() { document.body.removeChild(input); }, 5000);
}

// ==================== EXPORT ====================
function exportData() {
  // Always use cloud data
  if (cloudDashboardRecords.length === 0) {
    alert("暂无数据可导出");
    return;
  }
  var BOM = "\uFEFF";
  var headers = ["班组","提交时间","日期","分析模式","目标产值(万元)","实际产值(万元)","达成率/DLE(%)","计划工时/有效工时(h)","实际工时(h)","偏差(h)","损失工时(h)","差距覆盖(%)","产值状态","效率状态","异常原因"];
  var rows = cloudDashboardRecords.map(function(r) {
    var lossHours = (r.abnormalReasons || []).reduce(function(s, a) { return s + a.hours; }, 0);
    var reasons = (r.abnormalReasons || []).map(function(a) { return a.reason + "(" + a.hours.toFixed(1) + "h)" + (a.note ? ":" + a.note : ""); }).join("；");

    if (r.isDLE) {
      // DLE mode record
      var dle = r.dle || 0;
      var dlePct = (dle * 100).toFixed(1);
      var eh = r.effectiveHours || 0;
      var ah = r.actualHours || 0;
      var rLossGap = r.lossGap || (ah - eh);
      var coverage = r.coverage != null ? r.coverage : (rLossGap > 0 ? (lossHours / rLossGap) * 100 : 100);
      var dleThr = (r.teamName === "二部二课") ? 0.80 : 0.75;
      var effStatus = dle < dleThr ? "DLE需分析" : "DLE正常";
      return [
        r.teamName || "",
        r.submitTime || "",
        r.date || "",
        "DLE分析",
        "",
        "",
        dlePct,
        eh,
        ah,
        "",
        lossHours.toFixed(1),
        coverage.toFixed(0),
        "—",
        effStatus,
        reasons
      ];
    } else {
      // Normal mode record
      var compRate = pctNum(r.actualValue, r.targetValue);
      var hourDev = r.actualHours - r.standardHours;
      var coverage = r.coverage != null ? r.coverage : (lossHours > 0 ? 100 : 0);
      var isLowTarget = (r.targetValue || 0) < 1;
      var outputStatus = isLowTarget ? "—" : (compRate >= 100 ? "超额完成" : compRate >= 90 ? "基本达标" : compRate >= 80 ? "轻度未达标" : "严重未达标");
      var plannedPH = r.standardHours > 0 ? r.targetValue * 10000 / r.standardHours : 0;
      var actualPH = r.actualHours > 0 ? r.actualValue * 10000 / r.actualHours : 0;
      var efficiencyStatus = isLowTarget ? (hourDev > 0 ? "需分析" : hourDev === 0 ? "工时持平" : "正常") : (actualPH >= plannedPH ? "达标" : "未达标");
      return [
        r.teamName || "",
        r.submitTime || "",
        r.date || "",
        "人时产值分析",
        r.targetValue != null ? r.targetValue : "",
        r.actualValue != null ? r.actualValue : "",
        compRate.toFixed(1),
        r.standardHours != null ? r.standardHours : "",
        r.actualHours != null ? r.actualHours : "",
        hourDev,
        lossHours.toFixed(1),
        coverage.toFixed(0),
        outputStatus,
        efficiencyStatus,
        reasons
      ];
    }
  });
  var csv = BOM + headers.join(",") + "\n" + rows.map(function(row) {
    return row.map(function(cell) {
      var s = String(cell);
      if (s.indexOf(",") >= 0 || s.indexOf('"') >= 0 || s.indexOf("\n") >= 0) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(",");
  }).join("\n");
  showExportModal(csv);
}

        ta.select();

        catch(e) { ta.focus(); btn.textContent = "请手动全选复制"; }

  };

    }
    rowHtml += '<td>'+(r.abnormalReasons.length>0?'<button class="btn-detail" data-action="toggleDetail" data-param="'+r.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> '+(expanded?"收起":"详情")+'</button>':'')+'</td>';
    html += '<tr>'+rowHtml+'</tr>';
    if (expanded && r.abnormalReasons.length > 0) {
      html += '<tr class="detail-row"><td colspan="'+detailColspan+'"><div class="detail-content"><div class="detail-content-title">异常原因明细</div><div class="detail-reasons">';
      r.abnormalReasons.forEach(a => {
        const color = REASON_COLORS[a.reason] || "#6B7280";
        html += '<div class="detail-reason-tag" style="background:'+color+'10;border-color:'+color+'30;flex-direction:column;align-items:flex-start;gap:4px;padding:8px 12px">';
        html += '<div style="display:flex;align-items:center;gap:6px">'+getReasonIcon(a.reason).replace('stroke="currentColor"','stroke="'+color+'"')+'<span class="detail-reason-name">'+a.reason+'</span><span class="detail-reason-hours" style="color:'+color+'">'+a.hours.toFixed(1)+'h</span></div>';
        // Show data breakdown if available
        if (a.data && Object.keys(a.data).length > 0) {
          var breakdownParts = [];
          if (a.data.downtimeHours !== undefined) breakdownParts.push('停机'+a.data.downtimeHours+'h × '+a.data.affectedPeople+'人');
          if (a.data.hoursPerPerson !== undefined) breakdownParts.push((a.data.productModel||'')+' '+a.data.affectedPeople+'人×'+a.data.hoursPerPerson+'h');
          if (a.data.impactHours !== undefined) breakdownParts.push(a.data.impactHours+'h × '+(a.data.affectedPeople||0)+'人');
          if (breakdownParts.length > 0) {
            html += '<div style="font-size:11px;color:#6B7280">'+breakdownParts.join(' | ')+'</div>';
          }
        }
        if (a.note) { html += '<div style="font-size:12px;color:#6B7280;line-height:1.4;border-top:1px solid '+color+'20;padding-top:4px;width:100%">'+a.note+'</div>'; }
        html += '</div>';
      });
      html += '</div></div></td></tr>';
    }
  });
  html += '</tbody></table></div></div>';

  content.innerHTML = html;

  // Draw charts after DOM update
  setTimeout(() => {
    // Filter out DLE records from production/completion/hours charts (they have no 产值 data)
    var chartDataNormal = displayData.filter(function(r) {
      return !r.isDLE && r.teamName !== "二部一课" && r.teamName !== "二部二课";
    });
    // DLE teams only
    var chartDataDLE = displayData.filter(function(r) {
      return r.isDLE || r.teamName === "二部一课" || r.teamName === "二部二课";
    });
    drawProductionChart(chartDataNormal);
    drawHoursChart(chartDataNormal); // Hours chart excludes DLE teams
    drawDLEChart(chartDataDLE); // New DLE chart for DLE teams only
    drawCompletionChart(chartDataNormal);
    drawReasonsChart(reasonPie);
  }, 50);
}

function toggleDetail(id) {
  showDetailId = showDetailId === id ? null : id;
  renderDashboard();
}

// ==================== CHART DRAWING ====================
function drawProductionChart(data) {
  const canvas = document.getElementById("chart-production");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width;
  const h = rect.height;

  const padding = { top: 36, right: 20, bottom: 40, left: 60 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  const maxVal = Math.max(...data.map(r => Math.max(r.targetValue, r.actualValue))) * 1.15;
  const barWidth = chartW / data.length / 3;
  const groupWidth = chartW / data.length;

  // Grid lines
  ctx.strokeStyle = "#F3F4F6";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();
    ctx.fillStyle = "#6B7280";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(((maxVal / 4) * (4 - i)).toFixed(1) + "万", padding.left - 8, y + 4);
  }

  // Bars
  data.forEach((r, i) => {
    const x = padding.left + groupWidth * i + groupWidth / 2;
    const targetH = (r.targetValue / maxVal) * chartH;
    const actualH = (r.actualValue / maxVal) * chartH;

    // Target bar
    ctx.fillStyle = "#C7D2FE";
    ctx.beginPath();
    ctx.roundRect(x - barWidth - 2, padding.top + chartH - targetH, barWidth, targetH, [4, 4, 0, 0]);
    ctx.fill();

    // Target value label
    if (r.targetValue > 0) {
      ctx.fillStyle = "#9CA3AF";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(Number(r.targetValue).toFixed(1), x - barWidth / 2 - 2, padding.top + chartH - targetH - 3);
    }

    // Actual bar
    ctx.fillStyle = "#4F46E5";
    ctx.beginPath();
    ctx.roundRect(x + 2, padding.top + chartH - actualH, barWidth, actualH, [4, 4, 0, 0]);
    ctx.fill();

    // Actual value label
    if (r.actualValue > 0) {
      ctx.fillStyle = "#4F46E5";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(Number(r.actualValue).toFixed(1), x + barWidth / 2 + 2, padding.top + chartH - actualH - 3);
    }

    // Label
    ctx.fillStyle = "#6B7280";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(r.label || r.teamName, x, h - padding.bottom + 20);
  });

  // Legend
  ctx.fillStyle = "#C7D2FE";
  ctx.fillRect(padding.left, h - 15, 12, 12);
  ctx.fillStyle = "#6B7280";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("目标产值", padding.left + 16, h - 5);
  ctx.fillStyle = "#4F46E5";
  ctx.fillRect(padding.left + 80, h - 15, 12, 12);
  ctx.fillStyle = "#6B7280";
  ctx.fillText("实际产值", padding.left + 96, h - 5);
}

function drawHoursChart(data) {
  const canvas = document.getElementById("chart-hours");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width;
  const h = rect.height;

  const padding = { top: 32, right: 20, bottom: 40, left: 60 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  const maxVal = Math.max(...data.map(r => Math.max(r.standardHours, r.actualHours, r.abnormalReasons.reduce((s,a)=>s+a.hours,0)))) * 1.25;
  const barWidth = chartW / data.length / 4;
  const groupWidth = chartW / data.length;

  // Grid lines
  ctx.strokeStyle = "#F3F4F6";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();
    ctx.fillStyle = "#6B7280";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(Math.round((maxVal / 4) * (4 - i)) + "h", padding.left - 8, y + 4);
  }

  // Bars
  data.forEach((r, i) => {
    const x = padding.left + groupWidth * i + groupWidth / 2;
    const stdH = (r.standardHours / maxVal) * chartH;
    const actH = (r.actualHours / maxVal) * chartH;
    const lossH = (r.abnormalReasons.reduce((s,a)=>s+a.hours,0) / maxVal) * chartH;

    ctx.fillStyle = "#A7F3D0";
    ctx.beginPath();
    ctx.roundRect(x - barWidth * 1.5 - 4, padding.top + chartH - stdH, barWidth, stdH, [4, 4, 0, 0]);
    ctx.fill();

    // Planned hours label
    if (r.standardHours > 0) {
      ctx.fillStyle = "#9CA3AF";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(Math.round(r.standardHours), x - barWidth * 1.5 - 4 + barWidth / 2, padding.top + chartH - stdH - 3);
    }

    ctx.fillStyle = "#10B981";
    ctx.beginPath();
    ctx.roundRect(x - barWidth / 2 - 2, padding.top + chartH - actH, barWidth, actH, [4, 4, 0, 0]);
    ctx.fill();

    // Actual hours label
    if (r.actualHours > 0) {
      ctx.fillStyle = "#10B981";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(Math.round(r.actualHours), x - barWidth / 2 - 2 + barWidth / 2, padding.top + chartH - actH - 3);
    }

    ctx.fillStyle = "#FCA5A5";
    ctx.beginPath();
    ctx.roundRect(x + barWidth / 2 + 2, padding.top + chartH - lossH, barWidth, lossH, [4, 4, 0, 0]);
    ctx.fill();

    // Loss hours label
    if (lossH > 2) {
      ctx.fillStyle = "#DC2626";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(Math.round(r.abnormalReasons.reduce((s,a)=>s+a.hours,0)), x + barWidth / 2 + 2 + barWidth / 2, padding.top + chartH - lossH - 3);
    }

    ctx.fillStyle = "#6B7280";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(r.label || r.teamName, x, h - padding.bottom + 20);
  });

  // Legend
  const legends = [["#A7F3D0","计划工时"],["#10B981","实际工时"],["#FCA5A5","损失工时"]];
  legends.forEach((l, i) => {
    ctx.fillStyle = l[0];
    ctx.fillRect(padding.left + i * 80, h - 15, 12, 12);
    ctx.fillStyle = "#6B7280";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(l[1], padding.left + i * 80 + 16, h - 5);
  });
}

function drawDLEChart(data) {
  const canvas = document.getElementById("chart-dle");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width;
  const h = rect.height;

  const padding = { top: 32, right: 20, bottom: 40, left: 60 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  if (data.length === 0) {
    ctx.fillStyle = "#9CA3AF";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("暂无DLE数据", w / 2, h / 2);
    return;
  }

  // DLE is a percentage (0-100), use fixed max of 100%
  const maxVal = 100;
  const barWidth = chartW / data.length / 3;
  const groupWidth = chartW / data.length;

  // Grid lines (0%, 25%, 50%, 75%, 100%)
  ctx.strokeStyle = "#F3F4F6";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();
    ctx.fillStyle = "#6B7280";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(((maxVal / 4) * (4 - i)).toFixed(0) + "%", padding.left - 8, y + 4);
  }

  // Bars
  data.forEach((r, i) => {
    const x = padding.left + groupWidth * i + groupWidth / 2;
    var dle = r.dle || 0;
    var dlePct = dle * 100;
    var dleThr = (r.teamName === "二部二课") ? 80 : 75;
    var thrH = (dleThr / maxVal) * chartH;
    var dleH = (dlePct / maxVal) * chartH;

    // Target DLE bar
    ctx.fillStyle = "#C7D2FE";
    ctx.beginPath();
    ctx.roundRect(x - barWidth - 2, padding.top + chartH - thrH, barWidth, thrH, [4, 4, 0, 0]);
    ctx.fill();

    // Target DLE label
    ctx.fillStyle = "#9CA3AF";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(dleThr.toFixed(0) + "%", x - barWidth / 2 - 2, padding.top + chartH - thrH - 3);

    // Actual DLE bar
    var dleColor = dlePct < dleThr ? "#EF4444" : "#10B981";
    ctx.fillStyle = dleColor;
    ctx.beginPath();
    ctx.roundRect(x + 2, padding.top + chartH - dleH, barWidth, dleH, [4, 4, 0, 0]);
    ctx.fill();

    // Actual DLE label
    ctx.fillStyle = dleColor;
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(dlePct.toFixed(1) + "%", x + barWidth / 2 + 2, padding.top + chartH - dleH - 3);

    // Label
    ctx.fillStyle = "#6B7280";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(r.teamName, x, h - padding.bottom + 20);
  });

  // Legend
  ctx.fillStyle = "#C7D2FE";
  ctx.fillRect(padding.left, h - 15, 12, 12);
  ctx.fillStyle = "#6B7280";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("目标DLE", padding.left + 16, h - 5);
  ctx.fillStyle = "#10B981";
  ctx.fillRect(padding.left + 80, h - 15, 12, 12);
  ctx.fillStyle = "#6B7280";
  ctx.fillText("实际DLE(达标)", padding.left + 96, h - 5);
  ctx.fillStyle = "#EF4444";
  ctx.fillRect(padding.left + 190, h - 15, 12, 12);
  ctx.fillStyle = "#6B7280";
  ctx.fillText("实际DLE(未达标)", padding.left + 206, h - 5);
}

function drawCompletionChart(data) {
  const canvas = document.getElementById("chart-completion");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width;
  const h = rect.height;

  const padding = { top: 20, right: 40, bottom: 20, left: 80 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;
  const barHeight = chartH / data.length * 0.6;
  const gap = chartH / data.length;

  // Transform raw records into chart data
  const chartData = data.map(r => {
    const rate = pctNum(r.actualValue, r.targetValue);
    return { name: r.label || r.teamName, rate: rate, color: getCompletionColor(rate) };
  });

  // Grid lines
  ctx.strokeStyle = "#F3F4F6";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const x = padding.left + (chartW / 4) * i;
    ctx.beginPath();
    ctx.moveTo(x, padding.top);
    ctx.lineTo(x, h - padding.bottom);
    ctx.stroke();
    ctx.fillStyle = "#6B7280";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText((30 * i) + "%", x, h - 5);
  }

  // Bars
  chartData.forEach((r, i) => {
    const y = padding.top + gap * i + (gap - barHeight) / 2;
    const barW = (r.rate / 120) * chartW;

    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.roundRect(padding.left, y, barW, barHeight, [0, 6, 6, 0]);
    ctx.fill();

    ctx.fillStyle = "#374151";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(r.name, padding.left - 10, y + barHeight / 2 + 4);

    ctx.fillStyle = "#374151";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(r.rate.toFixed(1) + "%", padding.left + barW + 8, y + barHeight / 2 + 4);
  });
}

function drawReasonsChart(data) {
  const canvas = document.getElementById("chart-reasons");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width;
  const h = rect.height;

  if (data.length === 0) {
    ctx.fillStyle = "#9CA3AF";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("暂无异常数据", w / 2, h / 2);
    return;
  }

  const centerX = w / 2 - 40;
  const centerY = h / 2;
  const outerR = Math.min(w, h) / 2 - 30;
  const innerR = outerR * 0.6;
  const total = data.reduce((s, d) => s + d.value, 0);

  let startAngle = -Math.PI / 2;
  data.forEach((d, i) => {
    const sliceAngle = (d.value / total) * Math.PI * 2;
    const endAngle = startAngle + sliceAngle;

    ctx.fillStyle = REASON_COLORS[d.name] || "#6B7280";
    ctx.beginPath();
    ctx.arc(centerX, centerY, outerR, startAngle, endAngle);
    ctx.arc(centerX, centerY, innerR, endAngle, startAngle, true);
    ctx.closePath();
    ctx.fill();

    // Label
    const midAngle = startAngle + sliceAngle / 2;
    const labelR = outerR + 15;
    const labelX = centerX + Math.cos(midAngle) * labelR;
    const labelY = centerY + Math.sin(midAngle) * labelR;
    ctx.fillStyle = "#374151";
    ctx.font = "11px sans-serif";
    ctx.textAlign = midAngle > Math.PI / 2 && midAngle < Math.PI * 1.5 ? "right" : "left";
    ctx.fillText(d.name + " " + ((d.value/total)*100).toFixed(0) + "%", labelX, labelY);

    startAngle = endAngle;
  });

  // Center text
  ctx.fillStyle = "#111827";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(total + "h", centerX, centerY + 7);
  ctx.fillStyle = "#6B7280";
  ctx.font = "11px sans-serif";
  ctx.fillText("总损失工时", centerX, centerY + 22);
}

// Polyfill for roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
    const r = Array.isArray(radii) ? radii : [radii, radii, radii, radii];
    const [tl, tr, br, bl] = r.map(v => Math.min(v, w/2, h/2));
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
  };
}
